<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panneau d'information — CTA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
      transition: background-color 0.6s ease;
    }

    /* Nuances de bleu uniques pour chaque écran */
    body.bg-screen-0 { background-color: #070b14; } /* Écran 1 (Accueil) : Bleu nuit très profond */
    body.bg-screen-1 { background-color: #0d1b2a; } /* Écran 2 (SNCB) : Bleu ardoise / acier */
    body.bg-screen-2 { background-color: #0c182c; } /* Écran 3 (STIB) : Bleu marin / nuit douce */

    .container {
      width: 98%;
      max-width: 1450px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      max-width: 95px;
      max-height: 95px;
      margin-bottom: 1rem;
      object-fit: contain;
    }
    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      padding: 2rem 2.5rem;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    /* Cartes agrandies pour les pages 2 (SNCB) et 3 (STIB) */
    .card-transport {
      min-height: 76vh;
      padding: 2.2rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-transport h2 {
      font-size: 2.1rem;
      margin-bottom: 1.2rem;
    }

    h2 {
      font-size: 1.6rem;
      color: #94a3b8;
      font-weight: 300;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .standby-msg {
      font-size: 2.5rem;
      color: #64748b;
      font-weight: 300;
      padding: 2rem 0;
    }

    /* Liste des rendez-vous avec un encadré séparé pour chaque occurrence */
    .company-list {
      display: flex;
      flex-direction: column;
      gap: 21px; /* Espacement exact de 21px entre chaque encadré */
      width: 100%;
      align-items: center;
    }
    .company-item {
      font-size: 2.8rem;
      color: #38bdf8;
      font-weight: 700;
      line-height: 1.2;
      word-wrap: break-word;
      background: rgba(56, 189, 248, 0.08);
      padding: 1.2rem 2rem;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }

    /* Tableaux agrandis pour occuper l'espace sur les écrans 2 et 3 */
    .info-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      margin-top: 0.4rem;
      text-align: left;
      font-size: 1.85rem;
    }
    .info-table th {
      color: #94a3b8;
      font-weight: 500;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }
    .info-table td {
      padding: 1.15rem 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .info-table tr:last-child td {
      border-bottom: none;
    }
    
    .col-time {
      font-weight: 700;
      color: #38bdf8;
      width: 20%;
    }
    .col-dest {
      font-weight: 600;
      width: 52%;
    }
    .col-badge {
      text-align: center;
      width: 16%;
    }
    
    .train-delay {
      color: #f87171;
      font-size: 1.45rem;
      font-weight: 600;
      margin-left: 8px;
    }

    /* Badges officiels STIB & Quai SNCB agrandis */
    .badge-metro-1 { background: #eab308; color: #000; padding: 0.3rem 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1.5rem; display: inline-block; }
    .badge-metro-2 { background: #e11d48; color: #fff; padding: 0.3rem 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1.5rem; display: inline-block; }
    .badge-metro-5 { background: #f97316; color: #fff; padding: 0.3rem 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1.5rem; display: inline-block; }
    .badge-metro-6 { background: #0284c7; color: #fff; padding: 0.3rem 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1.5rem; display: inline-block; }
    .badge-bus     { background: #059669; color: #fff; padding: 0.3rem 0.85rem; border-radius: 8px; font-weight: 700; font-size: 1.5rem; display: inline-block; }
    
    .badge-default { background: rgba(255, 255, 255, 0.15); color: #fff; padding: 0.3rem 0.8rem; border-radius: 8px; font-weight: 700; font-size: 1.4rem; display: inline-block; }
    .platform-pill {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-radius: 10px;
      padding: 0.35rem 0.85rem;
      display: inline-block;
      font-weight: 700;
      font-size: 1.6rem;
    }
  </style>
</head>
<body class="bg-screen-0">

  <div class="container">
    <img src="logo.jpg" alt="Logo" class="logo" id="site-logo" onerror="this.style.display='none';">

    <!-- PAGE 1 : BIENVENUE & AGENDA (Occurrences séparées par des encadrés distincts) -->
    <div id="screen-welcome" style="width: 100%; display: block;">
      <div class="card" id="welcome-card" style="display: none;">
        <h2>Bienvenue dans nos locaux</h2>
        <div id="company-container" class="company-list">
          <!-- Injecté dynamiquement -->
        </div>
      </div>
      <div id="standby-card" style="display: block;">
        <div class="card">
          <p class="standby-msg">Bienvenue</p>
        </div>
      </div>
    </div>

    <!-- PAGE 2 : HORAIRES SNCB (Bruxelles-Nord) -->
    <div id="screen-trains" class="card card-transport" style="display: none;">
      <h2>Gare Bruxelles-Nord — Départs</h2>
      <table class="info-table">
        <thead>
          <tr>
            <th>Heure</th>
            <th>Destination</th>
            <th>Type</th>
            <th style="text-align: right;">Quai</th>
          </tr>
        </thead>
        <tbody id="train-list">
          <tr><td colspan="4" style="text-align:center; color:#94a3b8;">Chargement des trains...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- PAGE 3 : STIB (Yser + Sainte-Catherine combinés) -->
    <div id="screen-stib" class="card card-transport" style="display: none;">
      <h2>STIB — Yser & Sainte-Catherine</h2>
      <table class="info-table">
        <thead>
          <tr>
            <th style="text-align: center;">Ligne</th>
            <th>Destination</th>
            <th style="text-align: right;">Passage</th>
          </tr>
        </thead>
        <tbody id="stib-combined-list">
            <tr><td colspan="3" style="text-align:center; color:#94a3b8;">Chargement des transports STIB...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

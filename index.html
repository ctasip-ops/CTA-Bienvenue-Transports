<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panneau d'information — CTA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      text-align: center;
      overflow: hidden;
      transition: background-color 0.6s ease;
    }

    /* Nuances de bleu uniques pour chaque écran */
    body.bg-screen-0 { background-color: #070b14; } /* Écran 1 (Accueil) : Bleu nuit très profond */
    body.bg-screen-1 { background-color: #0d1b2a; } /* Écran 2 (SNCB) : Bleu ardoise / acier */
    body.bg-screen-2 { background-color: #0c182c; } /* Écran 3 (STIB) : Bleu marin / nuit douce */

    .container {
      width: 100%;
      height: 100%;
      max-width: none;
      padding: 1.5vh 2vw;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      max-width: 72px;
      max-height: 72px;
      margin-bottom: 1vh;
      object-fit: contain;
      flex-shrink: 0;
    }
    .card {
      width: 100%;
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      padding: 2vh 2.5vw;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Cartes maximisées pour les pages 2 (SNCB) et 3 (STIB) */
    .card-transport {
      width: 100%;
      flex: 1;
      height: 100%;
      padding: 2.2vh 3vw;
      justify-content: flex-start;
    }
    .card-transport h2 {
      font-size: clamp(1.8rem, 2.6vw, 2.8rem);
      margin-bottom: 1.5vh;
      flex-shrink: 0;
    }

    h2 {
      font-size: clamp(1.5rem, 2.2vw, 2.2rem);
      color: #94a3b8;
      font-weight: 400;
      margin-bottom: 1.5vh;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .standby-msg {
      font-size: clamp(2.4rem, 4.5vw, 4rem);
      color: #64748b;
      font-weight: 300;
      padding: 2rem 0;
    }

    #screen-welcome {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #screen-welcome > div {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Liste des rendez-vous avec un encadré séparé pour chaque occurrence */
    .company-list {
      display: flex;
      flex-direction: column;
      gap: 21px; /* Espacement exact de 21px entre chaque encadré */
      width: 100%;
      flex: 1;
      justify-content: center;
      align-items: center;
    }
    .company-item {
      font-size: clamp(2.2rem, 3.8vw, 3.6rem);
      color: #38bdf8;
      font-weight: 700;
      line-height: 1.2;
      word-wrap: break-word;
      background: rgba(56, 189, 248, 0.08);
      padding: 2vh 2.5vw;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }

    /* Tableaux étirés sur toute la largeur et la hauteur disponible */
    .info-table {
      width: 100%;
      flex: 1;
      height: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: clamp(1.75rem, 2.5vw, 2.65rem);
    }
    .info-table thead {
      display: table-header-group;
    }
    .info-table tbody {
      height: 100%;
    }
    .info-table th {
      color: #94a3b8;
      font-weight: 600;
      font-size: clamp(1.05rem, 1.4vw, 1.5rem);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding-bottom: 1vh;
      border-bottom: 2px solid rgba(255, 255, 255, 0.14);
    }
    .info-table td {
      padding: 0.8vh 0.8vw;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      vertical-align: middle;
    }
    .info-table tr:last-child td {
      border-bottom: none;
    }
    
    .col-time {
      font-weight: 700;
      color: #38bdf8;
      width: 22%;
      white-space: nowrap;
    }
    .col-dest {
      font-weight: 600;
      width: 50%;
    }
    .col-badge {
      text-align: center;
      width: 15%;
    }
    
    .train-delay {
      color: #f87171;
      font-size: clamp(1.3rem, 1.9vw, 2rem);
      font-weight: 700;
      margin-left: 8px;
    }

    /* Badges officiels STIB & Quai SNCB agrandis */
    .badge-metro-1 { background: #eab308; color: #000; padding: 0.35rem 1rem; border-radius: 10px; font-weight: 700; font-size: clamp(1.35rem, 2vw, 2.1rem); display: inline-block; }
    .badge-metro-2 { background: #e11d48; color: #fff; padding: 0.35rem 1rem; border-radius: 10px; font-weight: 700; font-size: clamp(1.35rem, 2vw, 2.1rem); display: inline-block; }
    .badge-metro-5 { background: #f97316; color: #fff; padding: 0.35rem 1rem; border-radius: 10px; font-weight: 700; font-size: clamp(1.35rem, 2vw, 2.1rem); display: inline-block; }
    .badge-metro-6 { background: #0284c7; color: #fff; padding: 0.35rem 1rem; border-radius: 10px; font-weight: 700; font-size: clamp(1.35rem, 2vw, 2.1rem); display: inline-block; }
    .badge-bus     { background: #059669; color: #fff; padding: 0.35rem 1rem; border-radius: 10px; font-weight: 700; font-size: clamp(1.35rem, 2vw, 2.1rem); display: inline-block; }
    
    .badge-default { background: rgba(255, 255, 255, 0.15); color: #fff; padding: 0.35rem 0.95rem; border-radius: 10px; font-weight: 700; font-size: clamp(1.3rem, 1.9vw, 2rem); display: inline-block; }
    .platform-pill {
      background: rgba(56, 189, 248, 0.16);
      color: #38bdf8;
      border-radius: 12px;
      padding: 0.4rem 1rem;
      display: inline-block;
      font-weight: 700;
      font-size: clamp(1.45rem, 2.2vw, 2.3rem);
      white-space: nowrap;
    }
  </style>
</head>

  <div class="container">
    <img src="logo.jpg" alt="Logo" class="logo" id="site-logo" onerror="this.style.display='none';">

    <!-- PAGE 1 : BIENVENUE & AGENDA (Occurrences séparées par des encadrés distincts) -->
    <div id="screen-welcome" style="display: flex;">
      <div class="card" id="welcome-card" style="display: none;">
        <h2>Bienvenue dans nos locaux</h2>
        <div id="company-container" class="company-list">
          <!-- Injecté dynamiquement -->
        </div>
      </div>
      <div id="standby-card" style="display: flex;">
        <div class="card">
          <p class="standby
